<style>

*{box-sizing:border-box}

<script>

/* ---------- lectura autom\u00e1tica de facturas ---------- */
let pdfjsP=null;
const pdfjs=()=>pdfjsP||(pdfjsP=(async()=>{const v='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';await load(v+'pdf.worker.min.js');await load(v+'pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=v+'pdf.worker.min.js';return pdfjsLib})());
let tessP=null;
const tess=()=>tessP||(tessP=load('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js').then(()=>Tesseract.createWorker('spa')));
async function ocr(canvas){const w=await tess();return (await w.recognize(canvas)).data.text}

async function textoDePagina(page){
  const tc=await page.getTextContent();
  const items=tc.items.filter(i=>i.str&&i.str.trim()!=='');
  const rows=[];
  for(const it of items){const y=it.transform[5];let row=rows.find(r=>Math.abs(r.y-y)<=3);if(!row){row={y,items:[]};rows.push(row)}row.items.push(it)}
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{r.items.sort((a,b)=>a.transform[4]-b.transform[4]);let s='',end=null;
    for(const it of r.items){const x=it.transform[4];if(end!==null)s+=(x-end>20?' \u00a6 ':' ');s+=it.str.trim();end=x+(it.width||0)}return s}).join('\n');
}
const CLIENTE=/serviagro|mari\s*lauqu|\bsaml\b/i;
const TIPOS={1:'A',6:'B',11:'C',51:'M',19:'E',2:'ND A',7:'ND B',12:'ND C',3:'NC A',8:'NC B',13:'NC C'};
const limpiar=s=>String(s||'').replace(/[\u00a6|]/g,' ').replace(/\s+/g,' ').trim();
const arNum=s=>{const n=Number(String(s).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:null};
function extraer(text){
  const r={proveedor:'',numero:'',fecha:'',importe:null,rev:false};
  let m;const re=/Raz[o\u00f3]n\s+Social:?\s*\u00a6?\s*([^\u00a6\n]+)/gi;
  while((m=re.exec(text))){const v=limpiar(m[1]);if(v.length>2&&!CLIENTE.test(v)){r.proveedor=v;break}}
  if(!r.proveedor){
    const stop=/^(original|duplicado|triplicado|factura|nota|recibo|comprobante|cod|fecha|cuit|ingresos|domicilio|p[a\u00e1]g|c\.?u\.?i\.?t)/i;
    for(const ln of text.split('\n').slice(0,12)){const seg=limpiar(ln.split('\u00a6')[0]);
      if(seg.length>=4&&/[A-Za-z\u00c1\u00c9\u00cd\u00d3\u00da\u00d1]{3}/.test(seg)&&!stop.test(seg)&&!CLIENTE.test(seg)){r.proveedor=seg;r.rev=true;break}}
  }
  const t=text.replace(/\u00a6/g,' ');
  m=t.match(/Punto\s+de\s+Venta:?\s*(\d{1,5})[\s\S]{0,60}?Comp\.?\s*(?:Nro|N[\u00b0\u00bao]|N[\u00fau]mero)\.?:?\s*(\d{1,8})/i)||t.match(/\b(\d{4,5})\s*-\s*(\d{8})\b/);
  if(m){let tipo='';const c=t.match(/C[o\u00f3]d\.?\s*0*(\d{1,3})\b/i);
    if(c&&TIPOS[+c[1]])tipo=TIPOS[+c[1]];
    else if(/nota\s+de\s+cr[e\u00e9]dito/i.test(t))tipo='NC';
    else{const l=t.match(/\b[Ff][Aa][Cc][Tt][Uu][Rr][Aa]\s+([ABCME])\b/);if(l)tipo=l[1]}
    r.numero=[tipo,String(Number(m[1])).padStart(4,'0')+'-'+m[2].padStart(8,'0')].filter(Boolean).join(' ');
  }
  m=t.match(/Fecha\s+de\s+Emisi[o\u00f3]n:?\s*(\d{2})[/](\d{2})[/](\d{4})/i)||t.match(/\b(\d{2})[/](\d{2})[/](20\d{2})\b/);
  if(m)r.fecha=`${m[3]}-${m[2]}-${m[1]}`;
  let im=[...t.matchAll(/Importe\s+Total:?\s*\$?\s*([\d.]+,\d{2})/gi)].map(x=>arNum(x[1]));
  if(!im.length)im=[...t.matchAll(/\bTOTAL\b:?\s*\$?\s*([\d.]+,\d{2})/gi)].map(x=>arNum(x[1]));
  if(im.length)r.importe=im[im.length-1];
  return r;
}

<script>

    const file=files[fi];

      if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){

          const page=await doc.getPage(p);

          await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
